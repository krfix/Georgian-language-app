name: Georgian
options:
  bundleIdPrefix: com.krfix
  deploymentTarget:
    iOS: "17.0"
targets:
  Georgian:
    type: application
    platform: iOS
    sources:
      - Georgian
    info:
      path: Georgian/Info.plist
      properties:
        CFBundleDisplayName: Ara
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchMark
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.education
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.krfix.georgian
        PRODUCT_NAME: Georgian
        MARKETING_VERSION: "0.3.0"
        CURRENT_PROJECT_VERSION: "1"   # set to the GitHub run number by the build
        TARGETED_DEVICE_FAMILY: "1"   # iPhone only
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
  GeorgianUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - GeorgianUITests
    dependencies:
      - target: Georgian
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.krfix.georgian.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Georgian
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  Georgian:
    build:
      targets:
        Georgian: all
        GeorgianUITests: [test]
    test:
      targets:
        - GeorgianUITests
