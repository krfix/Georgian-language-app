name: Build unsigned IPA

# Builds an IPA, kept lean because Mac minutes are paid for:
# - a push to a work branch never builds: build it by hand when an IPA is wanted;
# - a push to main builds only when a release is due (a MARKETING_VERSION in project.yml
#   with its own section in CHANGELOG.md and no GitHub Release yet) and the push changes more
#   than text (notes, changelog, docs); a commit message with [skip ci] doesn't build either;
# - "qa" ticked: the app runs in the iPhone Simulator instead: UI tests, then screenshots of
#   every main screen in light and dark (attached to the run as "screenshots");
# - "testflight" ticked: the app is signed by Apple's servers and uploaded to App Store Connect
#   for TestFlight (needs the ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8, APPLE_TEAM_ID secrets);
# - "Run workflow" on the Actions page builds any branch by hand.
# The release build publishes a GitHub Release, tagged v<version>, with the IPA and that
# version's notes from CHANGELOG.md.
# The name in the run list: the title given when the build is started by hand (Claude passes
# the latest commit's subject), else the commit message of the push, else the branch.
run-name: ${{ inputs.title || github.event.head_commit.message || format('{0} (by hand)', github.ref_name) }}

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'web/**'
      - '.github/workflows/web.yml'
  workflow_dispatch:
    inputs:
      title:
        description: Name shown in the run list (optional)
        required: false
        type: string
      qa:
        description: Run the UI tests and take screenshots in the Simulator instead of building the IPA
        required: false
        type: boolean
        default: false
      uitests:
        description: With qa, also run the UI tests (about 9 minutes); off takes only the screenshots
        required: false
        type: boolean
        default: true
      vine:
        description: With qa, only the Learn path's pictures on a small, a middle and a large iPhone (quick)
        required: false
        type: boolean
        default: false
      testflight:
        description: Sign the app and upload it to TestFlight (App Store Connect) instead of the unsigned IPA
        required: false
        type: boolean
        default: false

permissions:
  contents: write

# A newer push cancels the run still waiting or working on the same branch,
# so outdated builds don't hold a place in the Mac queue.
concurrency:
  group: build-${{ github.ref }}${{ inputs.qa && '-qa' || '' }}${{ inputs.testflight && '-tf' || '' }}
  cancel-in-progress: true

jobs:
  # A few seconds on a cheap Linux machine: does this push need the Mac build?
  decide:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.check.outputs.build }}
    steps:
      - uses: actions/checkout@v5
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          version=$(grep -E '^[[:space:]]*MARKETING_VERSION:' project.yml | head -1 | sed -E 's/.*MARKETING_VERSION:[[:space:]]*"?([^" ]+)"?.*/\1/')
          if ! grep -q "^## \[$version\]" CHANGELOG.md; then
            echo "::notice title=No build::CHANGELOG.md has no section for $version yet, so no release is due. Use Run workflow to build it."
            echo "build=false" >> "$GITHUB_OUTPUT"
          elif gh release view "v$version" >/dev/null 2>&1; then
            echo "::notice title=No build::Release v$version already exists, so this push to main isn't built. Use Run workflow to build it."
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  # One Mac job: tests first, then the app. A failed test still lets the IPA build and
  # upload (so it can be looked at), but no release is published and the run ends red.
  build:
    needs: decide
    if: needs.decide.outputs.build == 'true' && !inputs.qa && !inputs.testflight
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      # The App Store accepts only uploads built with Xcode 26 (iOS 26 SDK) or newer.
      # The newest Xcode 26 on the runner is used for the tests and the app.
      - name: Select Xcode 26
        run: |
          xcode=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | grep -vi beta | sort -V | tail -1)
          if [ -z "$xcode" ]; then
            echo "::error::No Xcode 26 on this runner: $(ls -d /Applications/Xcode*.app | tr '\n' ' ')"; exit 1
          fi
          sudo xcode-select -s "$xcode/Contents/Developer"
          echo "::notice title=Xcode::$(xcodebuild -version | tr '\n' ' ')"

      - name: Run tests
        id: tests
        continue-on-error: true
        run: |
          # Output goes into annotations (readable without logging in).
          report() { echo "::$1 title=$2::$(sed -e 's/%/%25/g' "$3" | awk 'BEGIN{ORS="%0A"} {print}')"; }
          if ! xcrun swiftc -O -o app-tests \
              Georgian/Curriculum/*.swift Georgian/Engine/*.swift \
              tools/Tests/main.swift > compile.log 2>&1; then
            grep -E "error" compile.log | sort -u | head -40 > errors.log; report error "Test compile" errors.log; exit 1
          fi
          status=0
          ./app-tests "$PWD" > results.log 2>&1 || status=$?
          # Failures first: annotations are cut off after a few kB.
          { grep FAIL results.log || true; tail -1 results.log; } > summary.log
          if [ $status -eq 0 ]; then report notice "Tests" summary.log; else report error "Tests" summary.log; fi
          exit $status

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      # DEV_TOOLS keeps Profile › Developer in this IPA (for Feather testing). The TestFlight
      # build below leaves it out, so the App Store version never shows it.
      - name: Build (no code signing)
        run: |
          set -o pipefail
          xcodebuild \
            -project Georgian.xcodeproj \
            -scheme Georgian \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS='$(inherited) DEV_TOOLS' \
            build | tee build.log | grep -E "error:|warning: .*Georgian/|BUILD (SUCCEEDED|FAILED)" || true
          if ! grep -q "BUILD SUCCEEDED" build.log; then
            # Surface compiler errors as annotations (readable without logging in).
            grep -E "error:" build.log | sort -u | head -30 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          fi

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Georgian.app Payload/
          # The App Store refuses an app without its privacy manifest.
          if [ ! -f Payload/Georgian.app/PrivacyInfo.xcprivacy ]; then
            echo "::error::PrivacyInfo.xcprivacy is missing from Georgian.app"; exit 1
          fi
          zip -qry Georgian.ipa Payload
          ls -lh Georgian.ipa
          version=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" Payload/Georgian.app/Info.plist)
          echo "::notice title=Version::$version (${{ github.run_number }})"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          # Named after version and build, e.g. Georgian-0.9.1-50.ipa
          cp Georgian.ipa "Georgian-$version-${{ github.run_number }}.ipa"
          echo "IPA=Georgian-$version-${{ github.run_number }}.ipa" >> "$GITHUB_ENV"

      # Uploaded as the .ipa itself, not inside a zip, so the download opens straight in Feather.
      - uses: actions/upload-artifact@v7
        with:
          path: ${{ env.IPA }}
          archive: false
          retention-days: 30

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: build-log
          retention-days: 7
          path: build.log

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main' && steps.tests.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$VERSION"
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; nothing to publish."
            exit 0
          fi
          # This version's section of CHANGELOG.md, without its heading.
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          cp Georgian.ipa "Georgian-$version.ipa"
          gh release create "$tag" "Georgian-$version.ipa" --target "$GITHUB_SHA" --title "Georgian $version" --notes-file notes.md
          echo "::notice title=Released::Georgian $version"

      - name: Fail the run if tests failed
        if: steps.tests.outcome == 'failure'
        run: |
          echo "::error::Tests failed (see the annotations above). The IPA was still built; no release was published."
          exit 1

  # The app in the iPhone Simulator: the UI tests (onboarding, a whole lesson, the tabs, a
  # restart that keeps progress), then pictures of every main screen in light and dark over
  # an invented learner (LaunchOptions: -uiTesting -seedDemo -screen <name>).
  # Signed by Apple's servers and uploaded to App Store Connect, from where TestFlight sends it
  # to testers. No Mac or certificate of our own: the App Store Connect API key (Admin role,
  # in the repo's Actions secrets) lets Xcode use a cloud-managed distribution certificate and
  # make the App Store profile for com.aralearn.ge. The build number is the run number.
  testflight:
    if: inputs.testflight && !inputs.qa
    runs-on: macos-15
    timeout-minutes: 60
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v5

      - name: Check the secrets
        run: |
          missing=""
          for n in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 APPLE_TEAM_ID; do
            [ -n "${!n}" ] || missing="$missing $n"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing Actions secrets:$missing (Settings > Secrets and variables > Actions)"; exit 1
          fi
          # The key file, where Xcode's tools look for it; deleted when the job's machine goes.
          mkdir -p ~/.appstoreconnect/private_keys
          key=~/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8
          printf '%s\n' "$ASC_KEY_P8" > "$key"
          grep -q "BEGIN PRIVATE KEY" "$key" || { echo "::error::ASC_KEY_P8 doesn't look like the .p8 file's text"; exit 1; }
          echo "KEY_PATH=$key" >> "$GITHUB_ENV"

      - name: Select Xcode 26
        run: |
          xcode=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | grep -vi beta | sort -V | tail -1)
          if [ -z "$xcode" ]; then
            echo "::error::No Xcode 26 on this runner: $(ls -d /Applications/Xcode*.app | tr '\n' ' ')"; exit 1
          fi
          sudo xcode-select -s "$xcode/Contents/Developer"
          echo "::notice title=Xcode::$(xcodebuild -version | tr '\n' ' ')"

      # Nothing broken goes to testers: the logic tests must pass first.
      - name: Run tests
        run: |
          report() { echo "::$1 title=$2::$(sed -e 's/%/%25/g' "$3" | awk 'BEGIN{ORS="%0A"} {print}')"; }
          if ! xcrun swiftc -O -o app-tests \
              Georgian/Curriculum/*.swift Georgian/Engine/*.swift \
              tools/Tests/main.swift > compile.log 2>&1; then
            grep -E "error" compile.log | sort -u | head -40 > errors.log; report error "Test compile" errors.log; exit 1
          fi
          status=0
          ./app-tests "$PWD" > results.log 2>&1 || status=$?
          { grep FAIL results.log || true; tail -1 results.log; } > summary.log
          if [ $status -eq 0 ]; then report notice "Tests" summary.log; else report error "Tests" summary.log; fi
          exit $status

      - name: Generate Xcode project
        run: brew install xcodegen && xcodegen generate

      # Archived unsigned; the export below signs it for the App Store.
      - name: Archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -project Georgian.xcodeproj -scheme Georgian -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/Ara.xcarchive \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            | tee archive.log | grep -E "error:|ARCHIVE (SUCCEEDED|FAILED)" || true
          if ! grep -q "ARCHIVE SUCCEEDED" archive.log; then
            grep -E "error:" archive.log | sort -u | head -30 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          fi
          app=build/Ara.xcarchive/Products/Applications/Georgian.app
          [ -f "$app/PrivacyInfo.xcprivacy" ] || { echo "::error::PrivacyInfo.xcprivacy is missing"; exit 1; }
          version=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" "$app/Info.plist")
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Sign and upload to App Store Connect
        run: |
          cat > ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>testFlightInternalTestingOnly</key><false/>
          </dict>
          </plist>
          PLIST
          set -o pipefail
          xcodebuild -exportArchive -archivePath build/Ara.xcarchive \
            -exportOptionsPlist ExportOptions.plist -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            2>&1 | tee export.log | grep -E "error|Upload|EXPORT (SUCCEEDED|FAILED)" || true
          if ! grep -q "EXPORT SUCCEEDED" export.log; then
            grep -iE "error" export.log | sort -u | head -30 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          fi
          echo "::notice title=Uploaded::Ara $VERSION (${{ github.run_number }}) is on its way to App Store Connect. It appears in TestFlight after Apple's processing (usually 5–30 minutes)."

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: testflight-logs
          retention-days: 7
          path: |
            archive.log
            export.log
          if-no-files-found: ignore

  qa:
    if: inputs.qa
    runs-on: macos-15
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode 26
        run: |
          xcode=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | grep -vi beta | sort -V | tail -1)
          if [ -z "$xcode" ]; then
            echo "::error::No Xcode 26 on this runner: $(ls -d /Applications/Xcode*.app | tr '\n' ' ')"; exit 1
          fi
          sudo xcode-select -s "$xcode/Contents/Developer"
          echo "::notice title=Xcode::$(xcodebuild -version | tr '\n' ' ')"

      - name: Run tests
        id: tests
        continue-on-error: true
        run: |
          # Output goes into annotations (readable without logging in).
          report() { echo "::$1 title=$2::$(sed -e 's/%/%25/g' "$3" | awk 'BEGIN{ORS="%0A"} {print}')"; }
          if ! xcrun swiftc -O -o app-tests \
              Georgian/Curriculum/*.swift Georgian/Engine/*.swift \
              tools/Tests/main.swift > compile.log 2>&1; then
            grep -E "error" compile.log | sort -u | head -40 > errors.log; report error "Test compile" errors.log; exit 1
          fi
          status=0
          ./app-tests "$PWD" > results.log 2>&1 || status=$?
          # Failures first: annotations are cut off after a few kB.
          { grep FAIL results.log || true; tail -1 results.log; } > summary.log
          if [ $status -eq 0 ]; then report notice "Tests" summary.log; else report error "Tests" summary.log; fi
          exit $status

      - name: Pick the iPhone
        run: |
          for name in "iPhone 17 Pro" "iPhone 16 Pro" "iPhone 17" "iPhone 16"; do
            udid=$(xcrun simctl list devices available | grep -E "^ +$name \(" | head -1 | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/')
            if [ -n "$udid" ]; then break; fi
          done
          if [ -z "$udid" ]; then
            echo "::error::No iPhone simulator found"; xcrun simctl list devices available; exit 1
          fi
          echo "::notice title=Device::$name ($udid)"
          echo "UDID=$udid" >> "$GITHUB_ENV"
          xcrun simctl boot "$udid" || true

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build for the Simulator
        run: |
          xcodegen generate
          set -o pipefail
          xcodebuild build-for-testing -project Georgian.xcodeproj -scheme Georgian -configuration Debug \
            -sdk iphonesimulator -destination "id=$UDID" -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO | tee build.log | grep -E "error:|warning: .*Georgian/|BUILD (SUCCEEDED|FAILED)|TEST BUILD (SUCCEEDED|FAILED)" || true
          if ! grep -qE "(TEST )?BUILD SUCCEEDED" build.log; then
            grep -E "error:" build.log | sort -u | head -40 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          fi
          warnings=$({ grep -E "warning: .*Georgian/" build.log || true; } | sort -u | wc -l | tr -d ' ')
          echo "::notice title=Warnings::$warnings compiler warnings in the app's code"
          { grep -E "warning: .*Georgian/" build.log || true; } | sort -u | head -15 | while IFS= read -r l; do echo "::warning::$l"; done

      - name: Take the pictures
        if: ${{ !inputs.vine }}
        run: |
          app=build/Build/Products/Debug-iphonesimulator/Georgian.app
          # macOS has no `timeout`: perl's alarm stops a command that hangs.
          limit() { secs=$1; shift; perl -e 'alarm shift; exec @ARGV' "$secs" "$@"; }
          # A simulator that hangs while booting is restarted once.
          if ! limit 240 xcrun simctl bootstatus "$UDID" -b > /dev/null; then
            echo "::warning::The simulator didn't finish booting; restarting it"
            xcrun simctl shutdown "$UDID" || true
            xcrun simctl boot "$UDID" || true
            limit 300 xcrun simctl bootstatus "$UDID" -b > /dev/null
          fi
          limit 120 xcrun simctl install "$UDID" "$app"
          # From here a single failed launch or picture is skipped, not fatal.
          set +e
          xcrun simctl status_bar "$UDID" override --time "9:41" --dataNetwork wifi --wifiMode active \
            --wifiBars 3 --cellularMode active --cellularBars 4 --batteryState charged --batteryLevel 100
          mkdir -p shots
          for look in light dark; do
            xcrun simctl ui "$UDID" appearance $look
            n=1
            # A page name; page@x for a phrasebook page about x (a category, phrase or
            # dialogue id; for search, the query); or exercise:<lesson>:<kind>.
            for page in onboarding home phrasebook category@transport emergency phrase@pb-ak-gamicheret-tu-sheidzleba \
                show@pb-ak-gamicheret-tu-sheidzleba search search@water search@qqzx dialogue@pd-bazaar practice@pd-restaurant saved \
                learn alphabet lesson complete words word review progress profile \
                exercise:a1:teachLetter exercise:a1:letterRecognition exercise:a3:missingLetter exercise:a3:reading \
                exercise:v7:multipleChoice exercise:v7:matching exercise:v7:fillBlank exercise:v7:spelling \
                exercise:v7:translation exercise:v7:sentenceBuilder exercise:g2:note exercise:g1:flashcard \
                exercise:c1:dialogue; do
              limit 30 xcrun simctl terminate "$UDID" com.aralearn.ge 2>/dev/null || true
              if [ "${page%%:*}" = exercise ]; then
                rest=${page#exercise:}; lesson=${rest%%:*}; kind=${rest#*:}
                limit 60 xcrun simctl launch "$UDID" com.aralearn.ge -uiTesting -seedDemo -screen exercise -lesson "$lesson" -kind "$kind" > /dev/null
                page="ex-$lesson-$kind"
              elif [ "${page#*@}" != "$page" ]; then
                name=${page%%@*}; arg=${page#*@}
                if [ "$name" = search ]; then flag=-query; else flag=-item; fi
                limit 60 xcrun simctl launch "$UDID" com.aralearn.ge -uiTesting -seedDemo -screen "$name" "$flag" "$arg" > /dev/null
                page="$name-$arg"
              else
                limit 60 xcrun simctl launch "$UDID" com.aralearn.ge -uiTesting -seedDemo -screen "$page" > /dev/null
              fi
              if [ $n -eq 1 ]; then sleep 9; else sleep 6; fi
              limit 60 xcrun simctl io "$UDID" screenshot "shots/$look-$(printf %02d $n)-$page.png" > /dev/null 2>&1
              n=$((n + 1))
            done
            # The iPhone's home screen, to see the app icon there.
            limit 30 xcrun simctl terminate "$UDID" com.aralearn.ge 2>/dev/null || true
            sleep 4
            limit 60 xcrun simctl io "$UDID" screenshot "shots/$look-$(printf %02d $n)-homescreen.png" > /dev/null 2>&1
          done
          # The largest text size (before the accessibility sizes), to check Dynamic Type.
          xcrun simctl ui "$UDID" appearance light
          xcrun simctl ui "$UDID" content_size extra-extra-extra-large
          for page in home phrasebook phrase@pb-ak-gamicheret-tu-sheidzleba show@pb-ak-gamicheret-tu-sheidzleba learn exercise:v7:multipleChoice complete; do
            limit 30 xcrun simctl terminate "$UDID" com.aralearn.ge 2>/dev/null || true
            if [ "${page%%:*}" = exercise ]; then
              rest=${page#exercise:}; lesson=${rest%%:*}; kind=${rest#*:}
              limit 60 xcrun simctl launch "$UDID" com.aralearn.ge -uiTesting -seedDemo -screen exercise -lesson "$lesson" -kind "$kind" > /dev/null
              page="ex-$lesson-$kind"
            elif [ "${page#*@}" != "$page" ]; then
              name=${page%%@*}; arg=${page#*@}
              limit 60 xcrun simctl launch "$UDID" com.aralearn.ge -uiTesting -seedDemo -screen "$name" -item "$arg" > /dev/null
              page="$name-$arg"
            else
              limit 60 xcrun simctl launch "$UDID" com.aralearn.ge -uiTesting -seedDemo -screen "$page" > /dev/null
            fi
            sleep 6
            limit 60 xcrun simctl io "$UDID" screenshot "shots/bigtext-$page.png" > /dev/null 2>&1
          done
          xcrun simctl ui "$UDID" content_size large
          # The app in Polish (-appLanguage pl): the main screens and the explanations, light
          # (polish-<page>.png, used by the App Store slides) and dark (polish-dark-<page>.png);
          # includes every screen the website shows (alphabet, show, search@woda).
          for look in light dark; do
            xcrun simctl ui "$UDID" appearance $look
            if [ $look = light ]; then prefix=polish; else prefix=polish-dark; fi
            for page in onboarding home phrasebook phrase@pb-ak-gamicheret-tu-sheidzleba show@pb-ak-gamicheret-tu-sheidzleba \
                search@apteka search@woda dialogue@pd-bazaar learn alphabet lesson words word review progress profile \
                exercise:a1:teachLetter exercise:a9:note exercise:v6c:note exercise:g7:note exercise:v7:multipleChoice \
                exercise:v7:translation complete; do
              limit 30 xcrun simctl terminate "$UDID" com.aralearn.ge 2>/dev/null || true
              if [ "${page%%:*}" = exercise ]; then
                rest=${page#exercise:}; lesson=${rest%%:*}; kind=${rest#*:}
                limit 60 xcrun simctl launch "$UDID" com.aralearn.ge -uiTesting -seedDemo -appLanguage pl -screen exercise -lesson "$lesson" -kind "$kind" > /dev/null
                page="ex-$lesson-$kind"
              elif [ "${page#*@}" != "$page" ]; then
                name=${page%%@*}; arg=${page#*@}
                if [ "$name" = search ]; then flag=-query; else flag=-item; fi
                limit 60 xcrun simctl launch "$UDID" com.aralearn.ge -uiTesting -seedDemo -appLanguage pl -screen "$name" "$flag" "$arg" > /dev/null
                page="$name-$arg"
              else
                limit 60 xcrun simctl launch "$UDID" com.aralearn.ge -uiTesting -seedDemo -appLanguage pl -screen "$page" > /dev/null
              fi
              sleep 6
              limit 60 xcrun simctl io "$UDID" screenshot "shots/$prefix-$page.png" > /dev/null 2>&1
            done
          done
          xcrun simctl ui "$UDID" appearance light
          echo "::notice title=Screenshots::$(ls shots | wc -l | tr -d ' ') pictures"

      # The Learn path (the grapevine, KART #15) on three screen widths, light and dark, at its
      # bottom, a module's start, the lesson up next and the top; the finished vine; and the
      # largest text sizes. vine-<size>-<look>-<where>.png.
      - name: Take the vine pictures
        if: inputs.vine
        timeout-minutes: 75
        run: |
          app=build/Build/Products/Debug-iphonesimulator/Georgian.app
          limit() { secs=$1; shift; perl -e 'alarm shift; exec @ARGV' "$secs" "$@"; }
          find_udid() {
            for name in "$@"; do
              u=$(xcrun simctl list devices available | grep -E "^ +$name \(" | head -1 | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/')
              if [ -n "$u" ]; then echo "$u $name"; return; fi
            done
          }
          small=$(find_udid "iPhone SE \\(3rd generation\\)" "iPhone 16e" "iPhone 13 mini" "iPhone 17")
          large=$(find_udid "iPhone 17 Pro Max" "iPhone 16 Pro Max" "iPhone 16 Plus" "iPhone Air")
          mkdir -p shots
          set +e
          log() { echo "$(date +%H:%M:%S) $*"; }
          fresh() {  # udid: a clean boot, used first and after a hung screenshot
            limit 60 xcrun simctl shutdown "$1" 2>/dev/null
            limit 60 xcrun simctl boot "$1" 2>/dev/null
            limit 300 xcrun simctl bootstatus "$1" -b > /dev/null
            limit 30 xcrun simctl status_bar "$1" override --time "9:41" --batteryState charged --batteryLevel 100
            sleep 5
          }
          snap() {  # udid file launch-args...: one picture, retried once on a fresh boot
            udid=$1; file=$2; shift 2
            for try in 1 2; do
              limit 30 xcrun simctl terminate "$udid" com.aralearn.ge 2>/dev/null
              limit 60 xcrun simctl launch "$udid" com.aralearn.ge -uiTesting -seedDemo -screen learn "$@" > /dev/null
              sleep 7
              rm -f "$file"
              limit 40 xcrun simctl io "$udid" screenshot "$file" > /dev/null 2>&1
              if [ -s "$file" ]; then log "ok $file"; return 0; fi
              rm -f "$file"; log "no picture: $file (try $try)"
              [ $try = 1 ] && { fresh "$udid"; limit 30 xcrun simctl ui "$udid" appearance "$look"; }
            done
            return 1
          }
          shoot() {  # udid size
            udid=$1; size=$2; misses=0
            log "start $size"
            fresh "$udid"
            limit 120 xcrun simctl install "$udid" "$app"
            for look in light dark; do
              limit 30 xcrun simctl ui "$udid" appearance $look
              for spot in next top bottom v1 g1 finished; do
                if [ $spot = next ]; then set --; elif [ $spot = finished ]; then set -- -seedAll -item top; else set -- -item $spot; fi
                if snap "$udid" "shots/vine-$size-$look-$spot.png" "$@"; then misses=0; else misses=$((misses+1)); fi
                # A Simulator that keeps failing is given up on, so the others still get their turn.
                if [ $misses -ge 2 ]; then log "giving up on $size"; break 2; fi
              done
            done
            limit 30 xcrun simctl ui "$udid" appearance light
            # One simulator at a time: a third one running made the run hang.
            limit 60 xcrun simctl shutdown "$udid"
          }
          shoot "$UDID" middle
          if [ -n "$large" ]; then echo "::notice title=Large iPhone::${large#* }"; shoot "${large%% *}" large; fi
          if [ -n "$small" ]; then echo "::notice title=Small iPhone::${small#* }"; shoot "${small%% *}" small; fi
          fresh "$UDID"; look=light
          for content in extra-extra-extra-large accessibility-large; do
            limit 30 xcrun simctl ui "$UDID" content_size $content
            snap "$UDID" "shots/vine-bigtext-$content-next.png"
            snap "$UDID" "shots/vine-bigtext-$content-v1.png" -item v1
          done
          limit 30 xcrun simctl ui "$UDID" content_size large
          limit 60 xcrun simctl shutdown "$UDID"
          echo "::notice title=Screenshots::$(ls shots | wc -l | tr -d ' ') pictures"

      # The Learn path (the grapevine, KART #15) on three screen widths, light and dark, at its
      # bottom, a module's start, the lesson up next and the top; the finished vine; and the
      # largest text sizes. vine-<size>-<look>-<where>.png.
      - name: Take the vine pictures
        if: inputs.vine
        timeout-minutes: 75
        run: |
          app=build/Build/Products/Debug-iphonesimulator/Georgian.app
          limit() { secs=$1; shift; perl -e 'alarm shift; exec @ARGV' "$secs" "$@"; }
          find_udid() {
            for name in "$@"; do
              u=$(xcrun simctl list devices available | grep -E "^ +$name \(" | head -1 | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/')
              if [ -n "$u" ]; then echo "$u $name"; return; fi
            done
          }
          small=$(find_udid "iPhone SE \\(3rd generation\\)" "iPhone 16e" "iPhone 13 mini" "iPhone 17")
          large=$(find_udid "iPhone 17 Pro Max" "iPhone 16 Pro Max" "iPhone 16 Plus" "iPhone Air")
          mkdir -p shots
          set +e
          shoot() {  # udid size
            udid=$1; size=$2
            xcrun simctl boot "$udid" 2>/dev/null
            limit 300 xcrun simctl bootstatus "$udid" -b > /dev/null
            limit 120 xcrun simctl install "$udid" "$app"
            limit 30 xcrun simctl status_bar "$udid" override --time "9:41" --batteryState charged --batteryLevel 100
            for look in light dark; do
              limit 30 xcrun simctl ui "$udid" appearance $look
              for spot in next top bottom v1 g1 finished; do
                limit 30 xcrun simctl terminate "$udid" com.aralearn.ge 2>/dev/null
                if [ $spot = next ]; then extra=""; elif [ $spot = finished ]; then extra="-seedAll -item top"; else extra="-item $spot"; fi
                limit 60 xcrun simctl launch "$udid" com.aralearn.ge -uiTesting -seedDemo -screen learn $extra > /dev/null
                sleep 7
                limit 60 xcrun simctl io "$udid" screenshot "shots/vine-$size-$look-$spot.png" > /dev/null 2>&1
              done
            done
            limit 30 xcrun simctl ui "$udid" appearance light
            # One simulator at a time: a third one running made the run hang.
            limit 60 xcrun simctl shutdown "$udid"
          }
          shoot "$UDID" middle
          xcrun simctl boot "$UDID" 2>/dev/null
          limit 300 xcrun simctl bootstatus "$UDID" -b > /dev/null
          for content in extra-extra-extra-large accessibility-large; do
            limit 30 xcrun simctl ui "$UDID" content_size $content
            for spot in next v1; do
              limit 30 xcrun simctl terminate "$UDID" com.aralearn.ge 2>/dev/null
              if [ $spot = next ]; then extra=""; else extra="-item $spot"; fi
              limit 60 xcrun simctl launch "$UDID" com.aralearn.ge -uiTesting -seedDemo -screen learn $extra > /dev/null
              sleep 7
              limit 60 xcrun simctl io "$UDID" screenshot "shots/vine-bigtext-$content-$spot.png" > /dev/null 2>&1
            done
          done
          limit 30 xcrun simctl ui "$UDID" content_size large
          limit 60 xcrun simctl shutdown "$UDID"
          if [ -n "$small" ]; then echo "::notice title=Small iPhone::${small#* }"; shoot "${small%% *}" small; fi
          if [ -n "$large" ]; then echo "::notice title=Large iPhone::${large#* }"; shoot "${large%% *}" large; fi
          echo "::notice title=Screenshots::$(ls shots | wc -l | tr -d ' ') pictures"

      - name: UI tests
        id: uitests
        if: inputs.uitests
        continue-on-error: true
        # A hung Simulator must not eat the whole job: the pictures are taken first.
        timeout-minutes: 30
        run: |
          set -o pipefail
          xcodebuild test-without-building -project Georgian.xcodeproj -scheme Georgian \
            -destination "id=$UDID" -derivedDataPath build -resultBundlePath ui.xcresult \
            CODE_SIGNING_ALLOWED=NO | tee uitest.log | grep -E "Test Case|error:|TEST (SUCCEEDED|FAILED)|Executed" || true
          { grep -E "error:|failed" uitest.log || true; } | grep -v "^Test Suite" | sort -u | head -20 | while IFS= read -r l; do echo "::error title=UI test::$l"; done || true
          grep -q "TEST EXECUTE SUCCEEDED\|TEST SUCCEEDED" uitest.log

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: screenshots
          retention-days: 7
          path: shots
          if-no-files-found: ignore

      # Also kept on the branch qa-screenshots (replaced on every run), so a cloud session
      # that can't download artifacts can still look at them with git.
      - name: Put the pictures on the qa-screenshots branch
        if: always()
        run: |
          [ -d shots ] && [ -n "$(ls shots)" ] || exit 0
          mkdir -p /tmp/qa && cp shots/*.png /tmp/qa/
          [ -f uitest.log ] && grep -E "Test Case|error:|Executed" uitest.log > /tmp/qa/uitest-summary.txt || true
          cd /tmp/qa
          git init -q -b qa-screenshots
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Screenshots from run ${{ github.run_number }} (${{ github.ref_name }} ${GITHUB_SHA::7})"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" qa-screenshots

      - name: Pack the test results
        if: steps.uitests.outcome == 'failure'
        run: zip -qry ui-results.zip ui.xcresult uitest.log || true

      - uses: actions/upload-artifact@v7
        if: steps.uitests.outcome == 'failure'
        with:
          name: ui-test-results
          retention-days: 7
          path: ui-results.zip

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: build-log
          retention-days: 7
          path: build.log

      - name: Fail the run if a test failed
        if: steps.uitests.outcome == 'failure' || steps.tests.outcome == 'failure'
        run: |
          echo "::error::Tests failed (see the annotations above, and ui-test-results for the UI tests)."
          exit 1
